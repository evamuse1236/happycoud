<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="A little constellation of Khushi’s conversations. Look closer, follow a thought, find a familiar voice." />
  <title>Khushi · A little universe of words</title>
</head>
<body>
  <main id="app">
    <div id="universe" role="img" aria-label="KHUSHI formed from comments. Use the zoom controls, or Read the words for an accessible list."></div>
    <header class="header">
      <button id="brand" class="brand" aria-label="Return to the whole constellation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c0 7-3 10-10 10 7 0 10 3 10 10 0-7 3-10 10-10-7 0-10-3-10-10Z"/></svg></button>
      <div class="header-actions"><button id="browse" class="icon-button" aria-label="Read all comments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h11"/></svg></button><button id="motion" class="icon-button" aria-label="Pause motion" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button></div>
    </header>
    <div class="invitation"><p id="intro">Look a little closer.</p><span id="counter">Gathering the words…</span></div>
    <div id="scene-status" role="status" class="scene-status">Gathering your constellation…</div>
    <button id="home" class="home-control" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m8 0h4v-4"/></svg>KHUSHI</button>
    <div id="hover-preview" class="hover-preview" hidden><p></p><span></span></div>
    <div class="bottom-stage">
      <p id="mood-description" class="mood-description">A name made of little moments.</p>
      <nav class="moods" aria-label="Explore by mood">
        <button data-mood="all" class="active" aria-pressed="true">Everything</button>
        <button data-mood="laugh" aria-pressed="false"><span class="mood-dot amber" aria-hidden="true"></span>Laughter</button>
        <button data-mood="love" aria-pressed="false"><span class="mood-dot rose" aria-hidden="true"></span>Love</button>
        <button data-mood="poetry" aria-pressed="false"><span class="mood-dot blue" aria-hidden="true"></span>Poetry</button>
      </nav>
      <button id="surprise" class="surprise" aria-label="Surprise me" title="Surprise me" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg></button>
      <p class="gesture-hint"><span class="desktop-hint">Scroll to look closer · Drag to wander · Click a phrase</span><span class="mobile-hint">Pinch to look closer · Tap a phrase</span></p>
    </div>
    <footer class="footer"><span id="coverage">The collection is growing.</span><div class="zoom-controls" aria-label="Zoom"><button id="zoom-out" class="icon-button" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><span id="zoom-label">1×</span><button id="zoom-in" class="icon-button" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button></div></footer>
    <aside id="reader" class="reader" aria-labelledby="reader-title" hidden>
      <div class="reader-top"><div class="sender"><span id="sender-initial" aria-hidden="true"></span><span id="reader-position"></span></div><button id="close-reader" class="icon-button" aria-label="Close comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="reader-scroll"><div id="reader-moods" class="reader-moods"></div><h1 id="reader-title"></h1><p id="reader-byline"></p><div id="thread"></div><div class="reader-links"><button id="same-author" class="text-button">More from this person</button><a id="original" target="_blank" rel="noopener noreferrer">Original comment <span aria-hidden="true">↗</span></a></div></div>
      <div class="reader-bottom"><button id="prev-comment" class="icon-button" aria-label="Previous comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><span id="read-count"></span><button id="next-comment" class="text-button">Next <span aria-hidden="true">→</span></button></div>
    </aside>
    <section id="library" class="library" aria-labelledby="library-title" hidden>
      <div class="library-heading"><div><h1 id="library-title">The words, up close.</h1><p id="library-note"></p></div><button id="close-library" class="icon-button" aria-label="Close reading list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div id="library-list"></div>
    </section>
    <div id="toast" role="status" class="toast" hidden></div>
    <span id="accessible-status" class="sr-only" aria-live="polite"></span>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
